spring.application.name=agencia-viagens-api
server.port=8080

# Banco em memoria (H2). Console: http://localhost:8080/h2-console  (JDBC: jdbc:h2:mem:agenciadb, usuario sa, senha vazia)
spring.datasource.url=jdbc:h2:mem:agenciadb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# API simulada da companhia aerea (projeto separado, porta diferente)
aerea.url=http://localhost:8085

